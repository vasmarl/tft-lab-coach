name: Build TFTCoach.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -v tests

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name TFTCoach
          --collect-all google.genai
          --collect-all sounddevice
          --collect-all _sounddevice_data
          --hidden-import win32gui
          --hidden-import win32process
          --hidden-import win32api
          --hidden-import common
          --hidden-import keystore
          --hidden-import engine
          --hidden-import overlay
          --hidden-import file_mode
          --hidden-import launcher
          --hidden-import safeguard
          --hidden-import capture
          --hidden-import screen_mode
          --hidden-import review_mode
          --hidden-import strategist
          app.py

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\TFTCoach.exe" -ArgumentList "--selftest" -Wait -PassThru
          Write-Host "Exit code: $($p.ExitCode)"
          if (Test-Path dist\tft_coach_output.log) { Get-Content dist\tft_coach_output.log }
          if ($p.ExitCode -ne 0 -or -not (Test-Path dist\selftest_ok.txt)) {
            Write-Host "---- tft_coach_error.log ----"
            if (Test-Path dist\tft_coach_error.log) { Get-Content dist\tft_coach_error.log }
            exit 1
          }
          Get-Content dist\selftest_ok.txt
          Get-Item dist\TFTCoach.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: TFTCoach
          path: dist/TFTCoach.exe
          if-no-files-found: error

      - name: GUI smoke test (launch every screen, take screenshots)
        shell: pwsh
        run: ./ci/gui_smoke.ps1

      - name: Real Gemini Live check (only if GOOGLE_API_KEY secret is set)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python ci/live_check.py smoke/sample_game.mp4 smoke

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            screenshots/*.png
            smoke/*.log
            smoke/*.md
          if-no-files-found: ignore
